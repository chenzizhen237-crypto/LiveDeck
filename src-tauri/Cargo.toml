[package]
name = "livedeck"
version = "0.1.0"
description = "LiveDeck - multi-platform live stream desktop client"
authors = ["c-zeong", "zizhen01"]
license = "AGPL-3.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.3.1", features = [] }

[dependencies]
livedeck-core = { path = "../livedeck-core" }
tauri = { version = "2.7.0", features = ["macos-private-api"] }
tauri-plugin-opener = "2.4.0"
tauri-plugin-os = "2.3.0"
tauri-plugin-log = "2.0.0"
tauri-plugin-window-state = "2"
window-vibrancy = "0.7.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.117"
tokio = { version = "1.37.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "stream", "cookies", "brotli", "gzip"] }
actix-web = "4"
actix-cors = "0.7"
bytes = "1"
futures-util = "0.3"
url = "2.4"
cookie = "0.18"
tracing = { version = "0.1", features = ["log"] }
log = "0.4"

# Static OpenSSL so Linux bundles don't depend on the distro's libssl.
[target.'cfg(target_os = "linux")'.dependencies]
openssl-sys = { version = "0.9", features = ["vendored"] }
