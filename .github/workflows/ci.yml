name: CI

# GitHub-hosted macOS runner (free on this public repo): frontend typecheck + build,
# frontend unit tests, and the backend's Rust tests.
on:
  push:
    branches: [main, livedeck-next]
  # Draft PRs skip CI; marking one ready for review runs it.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    if: github.event.pull_request.draft != true
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # Release builds on Apple's linker choke on Rust LTO bitcode (same as upstream's workflow).
      CARGO_PROFILE_RELEASE_LTO: "false"
      # pnpm 12 ignores the old "pnpm.onlyBuiltDependencies" field; don't fail installs on it.
      npm_config_strict_dep_builds: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install protoc
        run: brew install protobuf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend typecheck + build
        run: pnpm build

      - name: Frontend unit tests
        working-directory: web
        run: pnpm test

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
